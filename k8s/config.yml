apiVersion: v1
kind: ConfigMap
metadata:
  name: backend-config
  namespace: batalha-naval
data:
  DATABASE_URL: "jdbc:postgresql://postgres:5432/batalha"
  DATABASE_USER: "batalha"
  REDIS_HOST: "redis"
  REDIS_PORT: "6379"
  CACHE_TYPE: "redis"
  REDIS_HEALTH_ENABLED: "true"
  OTEL_EXPORTER_OTLP_ENDPOINT: "http://tempo:4318/v1/traces"
  CORS_ORIGINS: "http://localhost,http://batalha-naval.local"
  SPRING_PROFILES_ACTIVE: "docker"
---
apiVersion: v1
kind: Secret
metadata:
  name: backend-secret
  namespace: batalha-naval
type: Opaque
stringData:
  DATABASE_PASSWORD: "batalha123"

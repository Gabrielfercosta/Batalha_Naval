services:
  # ===== BANCO DE DADOS =====
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: batalha
      POSTGRES_USER: batalha
      POSTGRES_PASSWORD: batalha123
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U batalha"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ===== CACHE =====
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # ===== BACKEND =====
  backend:
    build:
      context: ./batalha_naval_back
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      DATABASE_URL: jdbc:postgresql://postgres:5432/batalha
      DATABASE_USER: batalha
      DATABASE_PASSWORD: batalha123
      REDIS_HOST: redis
      REDIS_PORT: 6379
      CACHE_TYPE: redis
      REDIS_HEALTH_ENABLED: "true"
      OTEL_EXPORTER_OTLP_ENDPOINT: http://tempo:4318/v1/traces
      CORS_ORIGINS: http://localhost:5173,http://localhost:3000
      SPRING_PROFILES_ACTIVE: docker
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # ===== FRONTEND =====
  frontend:
    build:
      context: ./batalha-naval_front
      dockerfile: Dockerfile
    ports:
      - "3000:80"
    depends_on:
      - backend

  # ===== OBSERVABILIDADE: Prometheus =====
  prometheus:
    image: prom/prometheus:v2.54.0
    ports:
      - "9090:9090"
    volumes:
      - ./observabilidade/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.enable-lifecycle'
    depends_on:
      - backend

  # ===== OBSERVABILIDADE: Grafana =====
  grafana:
    image: grafana/grafana:11.4.0
    ports:
      - "3001:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ./observabilidade/grafana/provisioning:/etc/grafana/provisioning
      - ./observabilidade/grafana/dashboards:/var/lib/grafana/dashboards
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus
      - tempo

  # ===== OBSERVABILIDADE: Tempo (Tracing) =====
  tempo:
    image: grafana/tempo:2.6.1
    ports:
      - "3200:3200"   # HTTP API
      - "4317:4317"   # OTLP gRPC
      - "4318:4318"   # OTLP HTTP
    volumes:
      - ./observabilidade/tempo/tempo.yml:/etc/tempo/config.yml
      - tempo_data:/var/tempo
    command: ["-config.file=/etc/tempo/config.yml"]

volumes:
  postgres_data:
  prometheus_data:
  grafana_data:
  tempo_data:
